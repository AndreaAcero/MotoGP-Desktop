    <main>
        <h2>Juego Cronometro de MotoGP-Desktop</h2>
        <div id="cronometro"></div>
         <!-- Párrafo donde se mostrará el tiempo -->
        <p>00:00.0</p>

        <!-- Botones para controlar el cronómetro -->
        <button id="btnArrancar">Arrancar</button>
        <button id="btnParar">Parar</button>
        <button id="btnReiniciar">Reiniciar</button>
        <script>
             // Crear instancia del cronómetro
        const miCronometro = new Cronometro();

        // Asociar botones a los métodos del cronómetro
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnArrancar').onclick = () => miCronometro.arrancar();
            document.getElementById('btnParar').onclick = () => miCronometro.parar();
            document.getElementById('btnReiniciar').onclick = () => miCronometro.reiniciar();
        });
        </script>
    </main>
</body>
