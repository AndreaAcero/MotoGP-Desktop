        <h2>Meteorología de MotoGP-Desktop</h2>
        <div id="infoCiudad"></div>
        <script>
            const ciudadMotoGP = new Ciudad("Towcester", "Reino Unido", "Towcesterian");
            ciudadMotoGP.setAtributos(150000, 41.38, 2.17);
            const contenedor = document.getElementById("infoCiudad");
            
            const intro = document.createElement("p");
            intro.textContent = `La ciudad de ${ciudadMotoGP.getNombre()} se encuentra en ${ciudadMotoGP.getPais()}. A continuación se detallan sus principales características:`;
            contenedor.appendChild(intro);
              
               const pInfoCiudad = document.createElement("p");
                pInfoCiudad.textContent = "Información de la ciudad:";
                contenedor.appendChild(pInfoCiudad);

                // Gentilicio y población usando tu método
                const divInfo = document.createElement("div");
                divInfo.innerHTML = ciudadMotoGP.getGentilicioPoblacion();
                contenedor.appendChild(divInfo);

                // Coordenadas usando tu método (⚠ sobrescribirá el documento)
                ciudadMotoGP.getCoordenadas();
        </script>
